services:
  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-hub-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: knowledge-hub-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DOCKER_DATABASE_URL}
    container_name: knowledge-hub-app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CRYPT_SALT: ${CRYPT_SALT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AI_RATE_LIMIT_RPM: ${AI_RATE_LIMIT_RPM}
      AI_CACHE_TTL_SEC: ${AI_CACHE_TTL_SEC}

      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}

      RAG_VECTOR_DB_PROVIDER: ${RAG_VECTOR_DB_PROVIDER}
      RAG_VECTOR_DB_URL: ${DOCKER_RAG_VECTOR_DB_URL}
      RAG_VECTOR_COLLECTION: ${RAG_VECTOR_COLLECTION}

      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
      RAG_CONVERSATION_MAX_MESSAGES: ${RAG_CONVERSATION_MAX_MESSAGES}
    ports:
      - '${PORT}:${PORT}'
    networks:
      - knowledge-hub-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:' + process.env.PORT + '/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    image: adminer
    container_name: knowledge-hub-adminer
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - '8080:8080'
    networks:
      - knowledge-hub-network
    depends_on:
      db:
        condition: service_healthy

  vectordb:
    image: qdrant/qdrant
    container_name: knowledge-hub-qdrant

    restart: unless-stopped

    ports:
      - '6333:6333'

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - knowledge-hub-network

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --spider -q http://localhost:6333/healthz || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  knowledge-hub-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
